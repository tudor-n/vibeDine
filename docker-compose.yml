services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d restaurant"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-api:
    build: ./backend/RestaurantApi
    ports:
      - "5005:5000"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=restaurant;Username=dev;Password=devpass"
      AiService__BaseUrl: "http://ai-service:8000"
      AllowedOrigins__0: "http://localhost:3000"
      AllowedOrigins__1: "http://localhost:3001"
      ASPNETCORE_ENVIRONMENT: "Development"
      # appsettings.Development.json is excluded by .dockerignore, so JWT config
      # must come from the environment (same pattern as the connection string).
      Jwt__Key: "dev-only-super-secret-signing-key-change-me-32+chars"
      Jwt__Issuer: "smart-restaurant"
      Jwt__Audience: "smart-restaurant"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "30"
      # PDF menu import
      MenuImport__HmacSecret: "dev-menu-import-hmac-secret-32chars-minimum"
      MenuImport__CallbackBaseUrl: "http://backend-api:5000"
      MenuImport__StorageRoot: "/menu-imports"
      # Email confirmation
      App__AdminBaseUrl: "http://localhost:3001"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
      Smtp__UseSsl: "false"
      Smtp__FromAddress: "no-reply@smart-restaurant.local"
      Smtp__FromName: "Smart Restaurant"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend/RestaurantApi:/src
      - menu_imports:/menu-imports

  # vibeDine HQ — platform/super-admin control plane. Shares the Postgres DB with
  # backend-api but owns its own auth (platform_admins) and registration-link tables.
  platform-api:
    build: ./backend/PlatformApi
    ports:
      - "5006:5000"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=restaurant;Username=dev;Password=devpass"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "dev-only-platform-signing-key-change-me-32+chars"
      Jwt__Issuer: "vibedine-platform"
      Jwt__Audience: "vibedine-platform"
      Jwt__AccessTokenMinutes: "720"
      # Default platform operator seeded on first start — change in production.
      PlatformSeed__Email: "admin@vibedine.local"
      PlatformSeed__Password: "ChangeMe123!"
      # Base URL one-time registration links point at (redeemed in the restaurant app).
      RegistrationLink__BaseUrl: "http://localhost:3001/register"
      AllowedOrigins__0: "http://localhost:3002"
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
    volumes:
      - ./backend/PlatformApi:/src

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — open http://localhost:8025 to inspect emails

  ai-service:
    build: ./backend/ai-scripts
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ai-scripts:/app
      - menu_imports:/menu-imports
    env_file:
      - path: ./backend/ai-scripts/.env
        required: false
    environment:
      MENU_IMPORT_STORAGE_ROOT: "/menu-imports"
      MENU_IMPORT_CALLBACK_HOSTS: "backend-api,localhost,127.0.0.1"

  frontend-customer:
    build: ./frontend-customer
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:5005/"
      VITE_WS_URL: "ws://localhost:5005"
    volumes:
      - ./frontend-customer:/app
      - /app/node_modules

  frontend-admin:
    build: ./frontend-admin
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: "http://localhost:5005/"
      # Base URL the generated table QR codes / links point at (customer app).
      VITE_CUSTOMER_URL: "http://localhost:3000"
    volumes:
      - ./frontend-admin:/app
      - ./shared:/shared:ro
      - /app/node_modules

  frontend-platform:
    build: ./frontend-platform
    ports:
      - "3002:3002"
    environment:
      VITE_API_URL: "http://localhost:5006/"
    volumes:
      - ./frontend-platform:/app
      - ./shared:/shared:ro
      - /app/node_modules

volumes:
  pgdata:
  menu_imports:

networks:
  default:
    name: restaurant-net
