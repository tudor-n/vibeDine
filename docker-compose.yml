services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      # Bound to loopback so the dev DB is never published on 0.0.0.0 if this
      # compose file is ever run on a non-localhost host.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d restaurant"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-api:
    build: ./backend/RestaurantApi
    ports:
      - "127.0.0.1:5005:5000"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=restaurant;Username=dev;Password=devpass"
      AiService__BaseUrl: "http://ai-service:8000"
      AllowedOrigins__0: "http://localhost:3000"
      AllowedOrigins__1: "http://localhost:3001"
      ASPNETCORE_ENVIRONMENT: "Development"
      # appsettings.Development.json is excluded by .dockerignore, so JWT config
      # must come from the environment (same pattern as the connection string).
      Jwt__Key: "dev-only-super-secret-signing-key-change-me-32+chars"
      Jwt__Issuer: "smart-restaurant"
      Jwt__Audience: "smart-restaurant"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "30"
      # PDF menu import
      MenuImport__HmacSecret: "dev-menu-import-hmac-secret-32chars-minimum"
      MenuImport__CallbackBaseUrl: "http://backend-api:5000"
      MenuImport__StorageRoot: "/menu-imports"
      # Email confirmation
      App__AdminBaseUrl: "http://localhost:3001"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
      Smtp__UseSsl: "false"
      Smtp__FromAddress: "no-reply@smart-restaurant.local"
      Smtp__FromName: "Smart Restaurant"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend/RestaurantApi:/src
      - menu_imports:/menu-imports
      # Uploaded blobs (branding logo/photo, avatars, menu-item images) are written
      # to /app/wwwroot/uploads at runtime. Without this, they live only in the
      # container's ephemeral layer and vanish on every image rebuild/recreate.
      # Bind to the host's own wwwroot/uploads (gitignored) so docker and host-run
      # (`dotnet run`) dev share the same files and they survive rebuilds.
      - ./backend/RestaurantApi/wwwroot/uploads:/app/wwwroot/uploads

  # vibeDine HQ — platform/super-admin control plane. Shares the Postgres DB with
  # backend-api but owns its own auth (platform_admins) and registration-link tables.
  platform-api:
    build: ./backend/PlatformApi
    ports:
      - "127.0.0.1:5006:5000"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=restaurant;Username=dev;Password=devpass"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "dev-only-platform-signing-key-change-me-32+chars"
      Jwt__Issuer: "vibedine-platform"
      Jwt__Audience: "vibedine-platform"
      Jwt__AccessTokenMinutes: "720"
      # Default platform operator seeded on first start — change in production.
      # Overridable via env so a real deploy never has to edit this file.
      PlatformSeed__Email: "admin@vibedine.local"
      PlatformSeed__Password: "${PLATFORM_SEED_PASSWORD:-ChangeMe123!}"
      # Base URL one-time registration links point at (redeemed in the restaurant app).
      RegistrationLink__BaseUrl: "http://localhost:3001/register"
      AllowedOrigins__0: "http://localhost:3002"
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
    volumes:
      - ./backend/PlatformApi:/src

  # vibeDine Ops — server/infrastructure management console. Shares the Postgres DB with
  # backend-api but owns its own auth (ops_admins) and ops_* tables. Manages Railway today and a
  # VPS (Hetzner/SSH) later through a pluggable provider layer; provider tokens are AES-GCM encrypted.
  ops-api:
    build: ./backend/OpsApi
    ports:
      - "127.0.0.1:5007:5000"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=restaurant;Username=dev;Password=devpass"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "dev-only-ops-signing-key-change-me-32+chars"
      Jwt__Issuer: "vibedine-ops"
      Jwt__Audience: "vibedine-ops"
      Jwt__AccessTokenMinutes: "720"
      # Default ops operator seeded on first start — change in production.
      # Overridable via env so a real deploy never has to edit this file.
      OpsSeed__Email: "ops@vibedine.local"
      OpsSeed__Password: "${OPS_SEED_PASSWORD:-ChangeMe123!}"
      # 32+ char secret that AES-GCM encrypts provider tokens at rest — change in production.
      Ops__Encryption__Key: "dev-only-ops-encryption-key-change-me-32chars"
      Ops__Railway__GraphqlEndpoint: "https://backboard.railway.com/graphql/v2"
      AllowedOrigins__0: "http://localhost:3003"
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
    volumes:
      - ./backend/OpsApi:/src

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI — open http://localhost:8025 to inspect emails

  ai-service:
    build: ./backend/ai-scripts
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/ai-scripts:/app
      - menu_imports:/menu-imports
    env_file:
      - path: ./backend/ai-scripts/.env
        required: false
    environment:
      MENU_IMPORT_STORAGE_ROOT: "/menu-imports"
      MENU_IMPORT_CALLBACK_HOSTS: "backend-api,localhost,127.0.0.1"
    healthcheck:
      # python is already in the image; avoids depending on curl/wget being present.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend-customer:
    build: ./frontend-customer
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_URL: "http://localhost:5005/"
      VITE_WS_URL: "ws://localhost:5005"
    volumes:
      - ./frontend-customer:/app
      # Branding pulls runtime code from @shared (../shared → /shared): the
      # welcome lockup + useTheme import shared/branding/derive at runtime, so
      # the shared dir must be mounted here just like the other frontends.
      - ./shared:/shared:ro
      - /app/node_modules

  frontend-admin:
    build: ./frontend-admin
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      VITE_API_URL: "http://localhost:5005/"
      # Base URL the generated table QR codes / links point at (customer app).
      VITE_CUSTOMER_URL: "http://localhost:3000"
    volumes:
      - ./frontend-admin:/app
      - ./shared:/shared:ro
      - /app/node_modules

  frontend-platform:
    build: ./frontend-platform
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      VITE_API_URL: "http://localhost:5006/"
    volumes:
      - ./frontend-platform:/app
      - ./shared:/shared:ro
      - /app/node_modules

  # vibeDine Ops console — talks to ops-api (5007).
  frontend-ops:
    build: ./frontend-ops
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      VITE_API_URL: "http://localhost:5007/"
    volumes:
      - ./frontend-ops:/app
      - ./shared:/shared:ro
      - /app/node_modules

volumes:
  pgdata:
  menu_imports:

networks:
  default:
    name: restaurant-net
