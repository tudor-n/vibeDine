services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d restaurant"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-api:
    build: ./backend/RestaurantApi
    ports:
      - "5005:5000"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=restaurant;Username=dev;Password=devpass"
      AiService__BaseUrl: "http://ai-service:8000"
      AllowedOrigins__0: "http://localhost:3000"
      AllowedOrigins__1: "http://localhost:3001"
      ASPNETCORE_ENVIRONMENT: "Development"
      # appsettings.Development.json is excluded by .dockerignore, so JWT config
      # must come from the environment (same pattern as the connection string).
      Jwt__Key: "dev-only-super-secret-signing-key-change-me-32+chars"
      Jwt__Issuer: "smart-restaurant"
      Jwt__Audience: "smart-restaurant"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "30"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/RestaurantApi:/src

  ai-service:
    build: ./backend/ai-scripts
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ai-scripts:/app
    env_file:                           
      - ./backend/ai-scripts/.env       

  frontend-customer:
    build: ./frontend-customer
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:5005/"
      VITE_WS_URL: "ws://localhost:5005"
    volumes:
      - ./frontend-customer:/app
      - /app/node_modules

  frontend-admin:
    build: ./frontend-admin
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: "http://localhost:5005/"
      # Base URL the generated table QR codes / links point at (customer app).
      VITE_CUSTOMER_URL: "http://localhost:3000"
    volumes:
      - ./frontend-admin:/app
      - ./shared:/shared:ro
      - /app/node_modules

volumes:
  pgdata:

networks:
  default:
    name: restaurant-net
