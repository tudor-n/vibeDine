name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  dotnet:
    name: C# ASP.NET Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build every backend app. The solution (web-restaurant.sln) only references
      # RestaurantApi, so each project is targeted explicitly. RestaurantApi is
      # built transitively by its test project below; PlatformApi and OpsApi have
      # no test project, so build them here to gate on compile errors.
      - name: Build PlatformApi
        run: dotnet build backend/PlatformApi/PlatformApi.csproj --configuration Release
      - name: Build OpsApi
        run: dotnet build backend/OpsApi/OpsApi.csproj --configuration Release

      # Run the real test suites (the old config ran `dotnet test` from the web
      # project, which discovers zero tests and always passed). The integration
      # tests boot a real Postgres via Testcontainers; ubuntu-latest runners ship
      # a working Docker daemon, which Testcontainers picks up automatically.
      - name: Test RestaurantApi
        run: dotnet test backend/RestaurantApi.Tests/RestaurantApi.Tests.csproj --configuration Release --verbosity normal
      - name: Test OpsApi
        run: dotnet test backend/OpsApi.Tests/OpsApi.Tests.csproj --configuration Release --verbosity normal

  python-ai:
    name: Python AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/ai-scripts/requirements.txt
      - run: pip install -r requirements.txt
      # Unit tests mock the provider, but the modules build a genai.Client at
      # import time, which rejects an empty key — so a dummy key is required for
      # collection. AI_INTERNAL_API_KEY is left UNSET so the router tests can hit
      # endpoints without the internal-auth header.
      - run: pytest --tb=short
        env:
          GEMINI_API_KEY: test-key-not-used-in-ci

  deploy:
    needs: [dotnet, python-ai]
    runs-on: ubuntu-latest
    environment: production
    # Never attempt a deploy from a pull_request event — only on pushes to a
    # protected branch. (Placeholder step; replace with the real deploy command.)
    if: github.event_name == 'push'
    steps:
      - name: Deploy
        run: echo "Deploy step — replace with your actual deploy command"
